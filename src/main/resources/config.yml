# =====================================================================
#                     Astral AntiCheat - Paper 1.21.11
# =====================================================================
#  BLOCK MODE (default)
#  Astral blocks cheats: hits of combat cheaters do not register, flyers /
#  speeders are pulled back, silent swaps and macros are cancelled.
#  Nobody is kicked or banned automatically. Staff with astral.alerts get ONE
#  short alert line per player that says what they might be using, and every
#  flag is written to plugins/Astral/logs/<date>.log.
#
#  Only want to watch? Set settings.mitigation: false.
#  Want automatic punishments? Set punishments.enabled: true and give a
#  check "punish: true" + punish-commands.
#
#  Minigames that move players themselves (battle bus, launch pads, parkour
#  boosters, cutscenes): riding / standing on entities, plugin teleports and
#  plugin velocity are handled automatically. For anything else use
#  settings.exempt-worlds or "/astral exempt <player> <seconds>".
#
#  Every check has:
#    enabled          - turn the check on / off  (also: /astral toggle <check>)
#    alert-vl         - staff only get an alert once the violation level (VL) reaches this
#    mitigate         - block this cheat (only used when settings.mitigation is true)
#    mitigate-vl      - VL needed before blocking starts
#    punish           - run punish-commands at punish-vl (only when punishments.enabled is true)
#    punish-vl        - VL needed to punish
#    punish-commands  - console commands. Placeholders: %player% %uuid% %check% %type% %vl% %ping%
#    decay            - VL removed from the player every "violations.decay-interval-seconds"
#
#  Players with the permission astral.bypass are NEVER checked or flagged.
#  astral.bypass.<check> bypasses one check (example: astral.bypass.reach).
#  /astral bypass <player> toggles it in-game.
# =====================================================================

# Do not change - used to update old config files
config-version: 2

settings:
  # true = block cheats (cancel hits, setbacks, cancel blocks...). false = WATCH ONLY (alerts + logs).
  mitigation: true
  # A setback never teleports a player further than this (blocks). Further away = the illegal
  # move is undone instead (back to the last checked position).
  max-setback-distance: 12.0
  # Worlds where Astral checks nobody (e.g. a lobby or a minigame world)
  exempt-worlds: []
  # Skip checks while the server is lagging (prevents false flags)
  lag-protection:
    enabled: true
    min-tps: 17.5
  # Combat checks are skipped for players with a higher ping than this (ms)
  max-combat-ping: 800
  # Highest ping (ms) used for lag compensation in reach / hitbox checks
  max-ping-compensation: 600
  # Ticks a player is ignored after joining
  join-exempt-ticks: 60
  # Skip Bedrock players (Geyser / Floodgate) - their movement is translated
  exempt-bedrock-players: true

alerts:
  # Staff with astral.alerts have alerts turned on when they join
  enabled-by-default: true
  # true = ONE line per player that says what they might be using (details in the hover).
  # false = old style, one line per flag.
  compact: true
  # Flags are collected this long before the first line about a player is sent
  gather-seconds: 1.0
  # A new cheat of the same player is reported at most once every ... seconds
  interval-seconds: 5
  # The same cheats are only reminded every ... seconds (with the new count)
  repeat-seconds: 30
  # After this long without flags, a player's cheats count as new again
  reset-after-seconds: 120
  # (compact: false only) minimum time between two alerts for the same player + check (milliseconds)
  cooldown-ms: 400
  # Also print alerts to the console
  console: true
  # Command run when a staff member clicks an alert
  click-command: "/astral tp %player%"

violations:
  # How often (seconds) VL decays
  decay-interval-seconds: 30

punishments:
  # Automatic punishments. OFF: Astral never kicks or bans anyone by itself.
  enabled: false
  # Broadcast the punish message (messages.yml -> punish-broadcast) to everyone
  broadcast: false
  # Default ban length used by the manual /astral ban command (e.g. 7d, 12h, 30m, perm)
  default-ban-duration: "30d"

freeze:
  # Commands run when a frozen player disconnects (%player% placeholder). Empty = nothing.
  quit-commands: []
  # Commands frozen players are still allowed to use
  allowed-commands: ["/msg", "/r", "/tell", "/w", "/reply", "/helpop"]

logging:
  # Write every flag to plugins/Astral/logs/<date>.log
  file: true
  # Amount of flags remembered per player for /astral logs
  memory-size: 150

# =====================================================================
#                               CHECKS
# =====================================================================
checks:

  # ------------------------------ COMBAT ------------------------------
  reach:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0
    # Extra blocks allowed on top of the vanilla attack range
    tolerance: 0.1
    # Hits needed in a row before a flag (filters jitter)
    buffer: 2.0

  hitbox:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0
    # Extra hitbox expansion allowed (blocks)
    margin: 0.1
    buffer: 3.0

  killaura:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 20
    punish-commands: []
    decay: 1.5
    multi: true       # hits 2+ entities in the same tick
    post: true        # attack sent after the movement packet (silent rotation auras)
    no-swing: true    # attacks without swinging the arm
    walls: true       # attacks through solid walls
    switch: true      # switching between targets that are far apart instantly
    # When blocking is on: attacks of a flagged player are cancelled for this many ticks
    block-attacks-ticks: 60

  autoblock:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 20
    punish-commands: []
    decay: 1.5

  criticals:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 20
    punish-commands: []
    decay: 1.5

  velocity:
    enabled: true
    alert-vl: 3.0
    mitigate: false
    mitigate-vl: 0.0
    punish: false
    punish-vl: 20
    punish-commands: []
    decay: 1.0
    # Minimum part of the vertical knockback the player has to take (0.0 - 1.0)
    min-vertical: 0.98
    # Minimum part of the horizontal knockback the player has to take (0.0 - 1.0)
    min-horizontal: 0.35

  # Silent aim / robotic rotations block the player's hits for a while. GCD (aim assist) only alerts.
  aim:
    enabled: true
    alert-vl: 3.0
    mitigate: true
    mitigate-vl: 1.0
    punish: false
    punish-vl: 40
    punish-commands: []
    decay: 2.0
    gcd: true          # rotations that do not match any real mouse sensitivity
    robotic: true      # perfectly repeated rotation steps (aimbots / rotation auras)
    silent-aim: true   # turns to the target for the hit and straight back (silent aim / silent rotations)

  # Mace smash with a faked fall distance (extra up/down position packets before the hit = mace kill).
  # When blocking the hit does not register.
  mace:
    enabled: true
    alert-vl: 1.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 10
    punish-commands: []
    decay: 1.0
    # blocks of fall distance the server may have more than Astral saw
    tolerance: 1.5

  crystalaura:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 20
    punish-commands: []
    decay: 1.5

  # ------------------------------ MOVEMENT -----------------------------
  flight:
    enabled: true
    alert-vl: 3.0
    mitigate: true
    mitigate-vl: 2.0
    punish: false
    punish-vl: 40
    punish-commands: []
    decay: 3.0
    # Allowed error of the gravity prediction (blocks / tick)
    tolerance: 0.005
    buffer: 3.0

  speed:
    enabled: true
    alert-vl: 3.0
    mitigate: true
    mitigate-vl: 2.0
    punish: false
    punish-vl: 40
    punish-commands: []
    decay: 3.0
    tolerance: 0.01
    buffer: 4.0

  nofall:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0
    # When blocking is on: deal the fall damage the cheater tried to avoid
    apply-damage: true

  timer:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 1.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0
    # How far ahead (ms) a client may get before flagging
    max-balance: 150
    # How much lag (ms) a client may "store" (bigger = fewer false flags on bad connections)
    max-lag-balance: 3000

  step:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0

  jesus:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 1.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0

  fastclimb:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 1.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0

  elytrafly:
    enabled: true
    alert-vl: 3.0
    mitigate: true
    mitigate-vl: 2.0
    punish: false
    punish-vl: 30
    punish-commands: []
    decay: 2.0
    # Highest legit elytra speed in blocks per tick (vanilla dive ~3.9)
    max-speed: 4.3

  noslow:
    enabled: true
    alert-vl: 3.0
    mitigate: true
    mitigate-vl: 2.0
    punish: false
    punish-vl: 30
    punish-commands: []
    decay: 2.0

  sprint:
    enabled: true
    alert-vl: 3.0
    mitigate: true
    mitigate-vl: 2.0
    punish: false
    punish-vl: 30
    punish-commands: []
    decay: 2.0

  phase:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0

  boatfly:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 1.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0

  # ------------------------------ PLAYER -------------------------------
  inventorymove:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0

  # Actions after the movement packet (auto pot / silent rotations) and more than one movement
  # packet per tick (rotate-act-rotate back, blink). Vanilla clients never do either.
  badpackets:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0

  fastbow:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 20
    punish-commands: []
    decay: 2.0
    max-shots-per-second: 6

  clientbrand:
    enabled: true
    alert-vl: 1.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 1
    punish-commands: []
    decay: 0.0
    # Client brands (contains, lower-case) that are reported to staff
    blocked-brands: ["wurst", "meteor", "aristois", "impact", "liquidbounce", "future", "rusherhack", "inertia", "sigma", "vape", "boze", "thunderhack", "nursultan", "prestige", "bleachhack", "coffee"]
    # Plugin channels (contains, lower-case) that are reported to staff
    blocked-channels: ["wurst", "meteor-client", "aristois", "liquidbounce", "rusherhack", "bleachhack", "boze"]

  # ------------------------------ WORLD --------------------------------
  fastbreak:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0
    # Lowest allowed (real break time / vanilla break time)
    min-ratio: 0.75

  nuker:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 20
    punish-commands: []
    decay: 2.0
    max-blocks-per-second: 22
    # Highest angle (degrees) between the look direction and a broken block
    max-angle: 75

  blockreach:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0
    tolerance: 0.3

  interact:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0

  fastplace:
    enabled: true
    alert-vl: 3.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0
    max-blocks-per-second: 25

  scaffold:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0

  xray:
    enabled: true
    alert-vl: 1.0
    mitigate: false
    mitigate-vl: 0.0
    punish: false
    punish-vl: 10
    punish-commands: []
    decay: 0.25
    # Minimum stone-like blocks mined before the ratio is evaluated
    min-stone: 120
    # Max ore veins found per 100 stone mined (diamond / debris / emerald)
    max-ratio: 4.5

  # ------------------------------ MACROS -------------------------------
  autoclicker:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 30
    punish-commands: []
    decay: 2.0
    # Highest legit clicks per second (held for a whole second)
    max-cps: 22
    # When blocking is on: above this CPS every attack is cancelled
    cancel-cps: 30
    # Fixed-delay auto clickers repeat at most 9 different 8-click rhythms. Humans use far more.
    max-patterns: 9

  autototem:
    enabled: true
    alert-vl: 1.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 15
    punish-commands: []
    decay: 1.0
    # A totem put in the off-hand through the inventory faster than this (ticks) after a pop is flagged
    min-ticks: 4

  inventorymacro:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 20
    punish-commands: []
    decay: 2.0
    # Clicks with an identical delay in a row needed to flag
    min-sequence: 9

  # Silent swap / auto attribute swap / auto stun slam. When blocking: the impossible swap is
  # cancelled, the hits after it do not register, and a caught player's swap hits do not
  # register for block-ticks.
  hotbarmacro:
    enabled: true
    alert-vl: 1.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 25
    punish-commands: []
    decay: 2.0
    # how long (ticks) the swap hits of a caught player do not register
    block-ticks: 600
    attribute-swap:
      # swap hits (+ swap back) per sample window, two windows in a row are needed
      samples: 6
      # swap back must always take exactly the same number of ticks (+ this spread)
      max-spread-ticks: 0
      max-swap-back-ticks: 10
      # share of weapon switch hits where the swap came in the same tick as the hit
      min-same-tick-ratio: 0.9
    stun-slam:
      # Axe breaks the shield and the swap to the mace comes in the SAME tick: impossible, always blocked.
      # Mace hit exactly 1 tick after the axe hit, this many stun slams in a row: alert
      in-a-row: 8
      # also block the mace hits of such a streak (very fast legit players can get 1 tick now and then)
      block-streaks: false

  autofish:
    enabled: true
    alert-vl: 2.0
    mitigate: false
    mitigate-vl: 0.0
    punish: false
    punish-vl: 10
    punish-commands: []
    decay: 0.5

  chat:
    enabled: true
    alert-vl: 3.0
    mitigate: true
    mitigate-vl: 0.0
    punish: false
    punish-vl: 20
    punish-commands: []
    decay: 2.0
    # Max messages allowed in "window-seconds"
    max-messages: 5
    window-seconds: 6
    # Report the same message sent twice within this many seconds (0 = off)
    duplicate-seconds: 20
    # Max commands per second
    max-commands-per-second: 5
