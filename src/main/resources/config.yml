# =====================================================================
#              MrTahaDarvish's AntiCheat  (Astral)  - Paper 1.21.11
# =====================================================================
#  Every check has the same base options:
#    enabled          - turn the check on / off  (also: /astral toggle <check>)
#    alert-vl         - staff only get an alert once the violation level (VL) reaches this
#    mitigate         - block the cheat (cancel hit / setback / cancel block / damage)
#    mitigate-vl      - VL needed before mitigation starts (0 = block from the first flag)
#    punish           - run punish-commands when punish-vl is reached
#    punish-vl        - VL needed to punish
#    punish-commands  - console commands. Placeholders: %player% %uuid% %check% %type% %vl% %ping%
#    decay            - VL removed from the player every "violations.decay-interval-seconds"
#
#  Players with the permission  astral.bypass  are NEVER checked, flagged,
#  set back or blocked.  astral.bypass.<check>  bypasses one check only
#  (example: astral.bypass.reach).  /astral bypass <player> toggles it in-game.
# =====================================================================

settings:
  # Skip checks while the server is lagging (prevents false flags)
  lag-protection:
    enabled: true
    min-tps: 17.5
  # Combat checks are skipped for players with a higher ping than this (ms)
  max-combat-ping: 800
  # Highest ping (ms) used for lag compensation in reach / hitbox checks
  max-ping-compensation: 600
  # Ticks a player is ignored after joining / respawning / changing world
  join-exempt-ticks: 60
  # Skip Bedrock players (Geyser / Floodgate) - their movement is translated
  exempt-bedrock-players: true
  # Use setbacks (teleport back to the last legit position) for movement checks
  setbacks: true

alerts:
  # Staff with astral.alerts have alerts turned on when they join
  enabled-by-default: true
  # Minimum time between two alerts for the same player + check (milliseconds)
  cooldown-ms: 400
  # Also print alerts to the console
  console: true
  # Command run when a staff member clicks an alert
  click-command: "/astral tp %player%"

violations:
  # How often (seconds) VL decays
  decay-interval-seconds: 30

punishments:
  enabled: true
  # Broadcast the punish message (messages.yml -> punish-broadcast) to everyone
  broadcast: true
  # Default ban length used by /astral ban when no time is given (e.g. 7d, 12h, 30m, perm)
  default-ban-duration: "30d"

freeze:
  # Commands run when a frozen player disconnects (%player% placeholder). Empty = nothing.
  quit-commands: []
  # Commands frozen players are still allowed to use
  allowed-commands: ["/msg", "/r", "/tell", "/w", "/reply", "/helpop"]

logging:
  # Write every flag to plugins/MrTahaDarvishAntiCheat/logs/<date>.log
  file: true
  # Amount of flags remembered per player for /astral logs
  memory-size: 100

# =====================================================================
#                               CHECKS
# =====================================================================
checks:

  # ------------------------------ COMBAT ------------------------------
  reach:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: true
    punish-vl: 25
    punish-commands: ["astral kick %player% Unfair Advantage (Reach)"]
    decay: 2.0
    # Extra blocks allowed on top of the vanilla attack range
    tolerance: 0.1
    # Hits needed in a row before a flag (filters jitter)
    buffer: 2.0

  hitbox:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: true
    punish-vl: 25
    punish-commands: ["astral kick %player% Unfair Advantage (Hitbox)"]
    decay: 2.0
    # Extra hitbox expansion allowed (blocks)
    margin: 0.1
    buffer: 3.0

  killaura:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: true
    punish-vl: 20
    punish-commands: ["astral kick %player% Unfair Advantage (KillAura)"]
    decay: 1.5
    # Detection types
    multi: true       # hits 2+ entities in the same tick
    post: true        # attack sent after the movement packet (silent rotation auras)
    no-swing: true    # attacks without swinging the arm
    walls: true       # attacks through solid walls
    # When flagged, all attacks of the player are cancelled for this many ticks
    block-attacks-ticks: 60

  autoblock:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: true
    punish-vl: 20
    punish-commands: ["astral kick %player% Unfair Advantage (AutoBlock)"]
    decay: 1.5

  criticals:
    enabled: true
    alert-vl: 2.0
    mitigate: true
    mitigate-vl: 0.0
    punish: true
    punish-vl: 20
    punish-commands: ["astral kick %player% Unfair Advantage (Criticals)"]
    decay: 1.5

  velocity:
    enabled: true
    alert-vl: 3.0
    mitigate: false
    mitigate-vl: 0.0
    punish: true
    punish-vl: 20
    punish-commands: ["astral kick %player% Unfair Advantage (Velocity)"]
    decay: 1.0
    # Minimum part of the vertical knockback the player has to take (0.0 - 1.0)
    min-vertical: 0.98
    # Minimum part of the horizontal knockback the player has to take (0.0 - 1.0)
    min-horizontal: 0.35

  aim:
    enabled: true
    alert-vl: 5.0
    mitigate: false
    mitigate-vl: 0.0
    punish: false
    punish-vl: 40
    punish-commands: ["astral kick %player% Unfair Advantage (Aim)"]
    decay: 2.0
    gcd: true          # rotations that do not match any real mouse sensitivity
    robotic: true      # perfectly repeated rotation steps (aimbots / rotation auras)
    snap: true         # snap to target and back in two ticks (silent aim)

  # ------------------------------ MOVEMENT -----------------------------
  flight:
    enabled: true
    alert-vl: 3.0
    mitigate: true
    mitigate-vl: 2.0
    punish: true
    punish-vl: 40
    punish-commands: ["astral kick %player% Unfair Advantage (Flight)"]
    decay: 3.0
    # Allowed error of the gravity prediction (blocks / tick)
    tolerance: 0.005
    buffer: 3.0

  speed:
    enabled: true
    alert-vl: 3.0
    mitigate: true
    mitigate-vl: 2.0
    punish: true
    punish-vl: 40
    punish-commands: ["astral kick %player% Unfair Advantage (Speed)"]
    decay: 3.0
